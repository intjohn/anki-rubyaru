[tool.poetry]
name = "anki_addon_rubyaru"
version = "0.1.0"
description = "Anki addon to detect ruby annotations in fields and mark their presence"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "rubyaru" }
]

[tool.poetry.dependencies]
python = "~3.13"  # Match your Python version

[tool.poetry.group.dev.dependencies]
mypy = "^1.8.0"
ruff = "^0.2.0"
pytest = "^8.0.0"
anki = "^25.0"
aqt = "25.02.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true 